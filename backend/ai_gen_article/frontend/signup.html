<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AI Gen</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    </head>
<body class="bg-gray-100 font-sans antialiased">
     <nav class="bg-green-600 p-4 text-white flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold">
                AI Text Generation Tool
            </h1>
        </div>
        <div>
            <a href="#login" class="text-white font-bold hover:text-blue-200 hover:underline">
                Login
            </a>
            <a href="#logout" class="text-white font-bold hover:text-blue-200 hover:underline">
                Signup
            </a>
        </div>
    </nav>
    <!--main content-->
    <div class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full">
            <form class="space-y-4">
                <h2 class="text-xl font-semibold text-green-700">
                    Signup Page - Join the AI Revolution!
                </h2>
                <div>
                    <label for="username" class="text-green-700 block mb-1 font-medium">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username please..." class="w-full p-2 border rounded-l bg-gray-100">
                </div>
                <div>
                    <label for="email" class="text-green-700 block mb-1 font-medium">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email please..." class="w-full p-2 border rounded-l bg-gray-100">
                </div>
                <div>
                    <label for="password" class="text-green-700 block mb-1 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password..." class="w-full p-2 border rounded-l bg-gray-100">
                </div>
                <div>
                    <label for="repeatpassword" class="text-green-700 block mb-1 font-medium">Repeat password</label>
                    <input type="password" id="repeatpassword" name="repeatpassword" placeholder="Repeat your password..." class="w-full p-2 border rounded-l bg-gray-100">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-500">Signup</button>
            </form>
        </div>
    </div>
</body>
</html>
