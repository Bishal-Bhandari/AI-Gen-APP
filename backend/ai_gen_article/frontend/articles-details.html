<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
     <nav class="bg-green-600 p-4 text-white flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold">
                AI Text Generation Tool
            </h1>
        </div>
        <div>
            <a href="#logout" class="text-white font-bold hover:text-blue-200 hover:underline">
                Logout
            </a>
        </div>
    </nav>
    <!--Content-->
    <div class="container mx-auto mt-10 px-4 sm:px-0">
        <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
            <section>
                <h2 class="text-2xl mb-4 font-semibold text-green-700">Article Details</h2>
                <div class="border border-green-400 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold text-green-700"> Article Title</h3>
                    <p class="text-green-700">
                        This is the content.....
                    </p>
                    <hr class="my-4 border-green-300">
                   <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Left side: Title & Description -->
                        <div>
                            <h4 class="text-lg font-semibold text-green-700">Video Title</h4>
                            <p class="text-green-700 text-sm">
                                Title of the video associated with this article
                            </p>
                        </div>
                        <!-- Right side: Video Link -->
                        <div>
                            <h4 class="text-lg font-semibold text-green-700">Video Link</h4>
                            <a 
                                href="https://www.youtube.com/shorts/3Xhlu2QGt54"
                                class="text-sm text-green-600 hover:underline hover:text-blue-600 break-all">
                                https://www.youtube.com/shorts/3Xhlu2QGt54
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
   
   <footer class="text-center p-4 text-green-700 mt-6 text-sm">
        Powered by OpenAI, Qovery & Thor himself.
    </footer>
</body>
</html>
