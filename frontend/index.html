<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gen</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen bg-gray-100 font-sans antialis">
    <nav class="bg-green-600 p-4 text-white flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold">
                AI Text Generation Tool
            </h1>
        </div>
        <div>
            <a href="#logout" class="text-white font-bold hover:text-blue-200 hover:underline">
                Logout
            </a>
        </div>
    </nav>
    <br>

    <!-- Main -->
    <div class="flex-grow container mx-auto mt-10 px-4 sm:px-0">
        <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md transition-transform transform hover:scale-105 flex flex-col">
            <!--Intro-->
            <div class="text-center">
                <h2 class="text-2xl font-semibold mb-4">
                    Welcome to AI Powered Text Generation Tool
                </h2>
                <p class="text-gray-700">
                    This tool allows you to generate AI-powered text content quickly and efficiently. 
                    It helps to get text fromt he video that you request us with your link.
                </p>
            </div>
            <br>

            <!--Link Section-->
            <div>
                <h2 class="text-green-700 text-xl mb-4 font-semibold">
                    Paste the Link.
                </h2>
                <div class="flex space-x-4">
                    <input id="youtubeLink" type="url" placeholder="Paste the link..." class="flex-grow p-2 border border-green-400 rounded-l-md">
                    <button id="generateBlogButton" class="bg-green-600 text-white px-4 py-2 rounded-r-md hover:bg-green-400 transition-colors">Generate</button>
                </div>
            </div>
            <br>
            <!--Display text -->
            <section class="mt-10 flex-grow">
                <h2 class="text-green-700 text-xl font-semibold">Generated Article</h2>
            </section>
        </div>
    </div>
</body>
</html>
